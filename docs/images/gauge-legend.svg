<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Green is healthy, orange is heavy, red is full" xmlns:c2pa="http://c2pa.org/manifest"><title>Green is healthy, orange is heavy, red is full</title><rect x="1" y="1" width="1198" height="358" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/><text x="48" y="60" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0F172A" >Reading the gauge</text><text x="48" y="92" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" >Same idea as a fuel gauge, just backwards: you want it low.</text><rect x="48" y="120" width="352" height="212" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><path d="M97.2 237.0 A54 54 0 0 1 166.0 160.7" fill="none" stroke="#22C55E" stroke-width="12" stroke-linecap="butt" opacity="0.22"/><path d="M166.0 160.7 A54 54 0 0 1 195.4 193.3" fill="none" stroke="#F59E0B" stroke-width="12" stroke-linecap="butt" opacity="0.22"/><path d="M195.4 193.3 A54 54 0 0 1 190.8 237.0" fill="none" stroke="#EF4444" stroke-width="12" stroke-linecap="butt" opacity="0.22"/><path d="M97.1 236.8 A54 54 0 0 1 107.0 170.6" fill="none" stroke="#22C55E" stroke-width="12" stroke-linecap="round" opacity="1"/><text x="144" y="217.2" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0F172A">32%</text><text x="144" y="290" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#22C55E" letter-spacing="2">HEALTHY</text><text x="234" y="190" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#0F172A" >0–59%</text><text x="234" y="222" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0F172A" >Plenty of room.</text><text x="234" y="248" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" >Keep working.</text><rect x="424" y="120" width="352" height="212" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><path d="M473.2 237.0 A54 54 0 0 1 542.0 160.7" fill="none" stroke="#22C55E" stroke-width="12" stroke-linecap="butt" opacity="0.22"/><path d="M542.0 160.7 A54 54 0 0 1 571.4 193.3" fill="none" stroke="#F59E0B" stroke-width="12" stroke-linecap="butt" opacity="0.22"/><path d="M571.4 193.3 A54 54 0 0 1 566.8 237.0" fill="none" stroke="#EF4444" stroke-width="12" stroke-linecap="butt" opacity="0.22"/><path d="M473.1 236.8 A54 54 0 0 1 560.1 173.9" fill="none" stroke="#F59E0B" stroke-width="12" stroke-linecap="round" opacity="1"/><text x="520" y="217.2" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0F172A">70%</text><text x="520" y="290" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#F59E0B" letter-spacing="2">GETTING FULL</text><text x="610" y="190" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#0F172A" >60–79%</text><text x="610" y="222" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0F172A" >Getting full.</text><text x="610" y="248" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" >Good time to finish</text><text x="610" y="270" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" >this task.</text><rect x="800" y="120" width="352" height="212" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><path d="M849.2 237.0 A54 54 0 0 1 918.0 160.7" fill="none" stroke="#22C55E" stroke-width="12" stroke-linecap="butt" opacity="0.22"/><path d="M918.0 160.7 A54 54 0 0 1 947.4 193.3" fill="none" stroke="#F59E0B" stroke-width="12" stroke-linecap="butt" opacity="0.22"/><path d="M947.4 193.3 A54 54 0 0 1 942.8 237.0" fill="none" stroke="#EF4444" stroke-width="12" stroke-linecap="butt" opacity="0.22"/><path d="M849.1 236.8 A54 54 0 1 1 949.7 215.6" fill="none" stroke="#EF4444" stroke-width="12" stroke-linecap="round" opacity="1"/><text x="896" y="217.2" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0F172A">90%</text><text x="896" y="290" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#EF4444" letter-spacing="2">ALMOST FULL</text><text x="986" y="190" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#0F172A" >80%+</text><text x="986" y="222" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0F172A" >Almost full.</text><text x="986" y="248" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" >Type <tspan font-family="Consolas, monospace" font-weight="700" fill="#7C3AED">/compact</tspan> or</text><text x="986" y="270" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" >start a new chat.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
