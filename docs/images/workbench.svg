<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Your chat is like a workbench that fills up" xmlns:c2pa="http://c2pa.org/manifest"><title>Your chat is like a workbench that fills up</title><rect x="1" y="1" width="1198" height="468" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/><text x="48" y="62" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#0F172A" >Think of your chat as a workbench</text><text x="48" y="96" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" >Everything the AI sees sits on the bench. The bench has a fixed size. When it's full, old stuff gets swept off.</text><rect x="48" y="140" width="352" height="296" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><text x="70" y="180" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#0F172A" >1. New chat</text><text x="70" y="208" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" >Lots of room. The AI remembers everything.</text><rect x="84" y="300" width="64" height="36" rx="7" fill="#64748B"/><rect x="154" y="300" width="8" height="36" rx="7" fill="#10B981"/><rect x="70" y="340" width="308" height="14" rx="4" fill="#A16207"/><rect x="86" y="354" width="10" height="34" fill="#854D0E"/><rect x="352" y="354" width="10" height="34" fill="#854D0E"/><rect x="70" y="402" width="308" height="12" rx="6" fill="#E2E8F0"/><rect x="70" y="402" width="46" height="12" rx="6" fill="#22C55E"/><path d="M404 288 l14 0 m-7 -7 l7 7 l-7 7" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="424" y="140" width="352" height="296" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><text x="446" y="180" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#0F172A" >2. Deep in a project</text><text x="446" y="208" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" >Files, tool results and replies pile up.</text><rect x="460" y="300" width="64" height="36" rx="7" fill="#64748B"/><rect x="530" y="300" width="64" height="36" rx="7" fill="#0EA5E9"/><rect x="600" y="300" width="44" height="36" rx="7" fill="#8B5CF6"/><rect x="650" y="300" width="8" height="36" rx="7" fill="#10B981"/><rect x="664" y="300" width="34" height="36" rx="7" fill="#0EA5E9"/><rect x="460" y="258" width="34" height="36" rx="7" fill="#8B5CF6"/><rect x="446" y="340" width="308" height="14" rx="4" fill="#A16207"/><rect x="462" y="354" width="10" height="34" fill="#854D0E"/><rect x="728" y="354" width="10" height="34" fill="#854D0E"/><rect x="446" y="402" width="308" height="12" rx="6" fill="#E2E8F0"/><rect x="446" y="402" width="216" height="12" rx="6" fill="#F59E0B"/><path d="M780 288 l14 0 m-7 -7 l7 7 l-7 7" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="800" y="140" width="352" height="296" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><text x="822" y="180" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#0F172A" >3. Bench is full</text><text x="822" y="208" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" >Old details get swept off the edge.</text><rect x="836" y="300" width="64" height="36" rx="7" fill="#64748B"/><rect x="906" y="300" width="64" height="36" rx="7" fill="#0EA5E9"/><rect x="976" y="300" width="44" height="36" rx="7" fill="#8B5CF6"/><rect x="1026" y="300" width="8" height="36" rx="7" fill="#10B981"/><rect x="1040" y="300" width="34" height="36" rx="7" fill="#0EA5E9"/><rect x="836" y="258" width="34" height="36" rx="7" fill="#8B5CF6"/><rect x="876" y="258" width="84" height="36" rx="7" fill="#0EA5E9"/><rect x="966" y="258" width="64" height="36" rx="7" fill="#8B5CF6"/><rect x="1036" y="258" width="24" height="36" rx="7" fill="#F59E0B"/><rect x="836" y="216" width="74" height="36" rx="7" fill="#0EA5E9"/><rect x="822" y="340" width="308" height="14" rx="4" fill="#A16207"/><rect x="838" y="354" width="10" height="34" fill="#854D0E"/><rect x="1104" y="354" width="10" height="34" fill="#854D0E"/><g transform="rotate(25 1126 370)"><rect x="1116" y="358" width="34" height="26" rx="6" fill="#0EA5E9" opacity=".55"/></g><g transform="rotate(-18 1152 406)"><rect x="1136" y="396" width="28" height="22" rx="6" fill="#8B5CF6" opacity=".4"/></g><rect x="822" y="402" width="308" height="12" rx="6" fill="#E2E8F0"/><rect x="822" y="402" width="308" height="12" rx="6" fill="#EF4444"/><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
