<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-label="The five colours in the What's Filling Memory breakdown" xmlns:c2pa="http://c2pa.org/manifest"><title>The five colours in the What's Filling Memory breakdown</title><rect x="1" y="1" width="1198" height="588" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/><text x="48" y="60" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0F172A" >Memory breakdown: what's on the bench?</text><text x="48" y="92" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" >The panel splits everything into five colours. Here's what each one means.</text><rect x="48.0" y="118" width="193.8" height="26" rx="5" fill="#64748B"/><rect x="244.8" y="118" width="478.0" height="26" rx="5" fill="#0EA5E9"/><rect x="725.7" y="118" width="379.6" height="26" rx="5" fill="#8B5CF6"/><rect x="1108.3" y="118" width="7.9" height="26" rx="5" fill="#10B981"/><rect x="1119.2" y="118" width="29.8" height="26" rx="5" fill="#F59E0B"/><rect x="48" y="178" width="1104" height="62" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="66" y="197" width="24" height="24" rx="6" fill="#64748B"/><text x="108" y="216" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#0F172A" >Fixed setup</text><text x="400" y="206" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F172A" >The fixed setup every chat starts with.</text><text x="400" y="228" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" >Antigravity's own instructions, your rules files, and every connected tool and skill.</text><text x="1130" y="218" text-anchor="end" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#64748B" >18%</text><rect x="48" y="250" width="1104" height="62" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="66" y="269" width="24" height="24" rx="6" fill="#0EA5E9"/><text x="108" y="288" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#0F172A" >Tool results</text><text x="400" y="278" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F172A" >Things the AI read or ran.</text><text x="400" y="300" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" >Opening files, listing folders, command results, replies from Maya, Blender, Nuke…</text><text x="1130" y="290" text-anchor="end" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0EA5E9" >44%</text><rect x="48" y="322" width="1104" height="62" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="66" y="341" width="24" height="24" rx="6" fill="#8B5CF6"/><text x="108" y="360" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#0F172A" >AI's replies and thinking</text><text x="400" y="350" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F172A" >The AI talking and thinking.</text><text x="400" y="372" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" >Its answers to you, plus the behind-the-scenes reasoning.</text><text x="1130" y="362" text-anchor="end" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#8B5CF6" >35%</text><rect x="48" y="394" width="1104" height="62" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="66" y="413" width="24" height="24" rx="6" fill="#10B981"/><text x="108" y="432" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#0F172A" >Your prompts</text><text x="400" y="422" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F172A" >What you typed.</text><text x="400" y="444" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" >Usually tiny. Your words are rarely the problem!</text><text x="1130" y="434" text-anchor="end" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#10B981" >1%</text><rect x="48" y="466" width="1104" height="62" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="66" y="485" width="24" height="24" rx="6" fill="#F59E0B"/><text x="108" y="504" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#0F172A" >System notes</text><text x="400" y="494" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F172A" >Notes Antigravity adds.</text><text x="400" y="516" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" >Summaries after a cleanup, reminders, status messages.</text><text x="1130" y="506" text-anchor="end" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#F59E0B" >3%</text><text x="48" y="560" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" >Example numbers from a real chat. Tip: if the grey bar is big before you've even started, you have too many tools connected.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
