<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Before and after running /compact" xmlns:c2pa="http://c2pa.org/manifest"><title>Before and after running /compact</title><rect x="1" y="1" width="1198" height="328" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/><text x="48" y="60" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0F172A" >What /compact does</text><text x="48" y="92" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" >It squashes the chat into a short summary, so you get room back. You choose when, so nothing important gets lost.</text><text x="48" y="150" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#0F172A" >Before</text><text x="488" y="150" text-anchor="end" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#EF4444" >88%</text><rect x="48" y="166" width="440" height="54" rx="12" fill="#E2E8F0"/><rect x="51.0" y="171" width="73.2" height="44" rx="9" fill="#64748B"/><rect x="130.2" y="171" width="143.6" height="44" rx="9" fill="#0EA5E9"/><rect x="279.8" y="171" width="126.0" height="44" rx="9" fill="#8B5CF6"/><rect x="411.8" y="171" width="2.8" height="44" rx="9" fill="#10B981"/><rect x="420.6" y="171" width="11.6" height="44" rx="9" fill="#F59E0B"/><rect x="530" y="168" width="140" height="50" rx="25" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="600" y="200" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="19" font-weight="700" fill="#6D28D9" >/compact</text><path d="M680 193 h40 m-12 -12 l12 12 l-12 12" fill="none" stroke="#7C3AED" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="732" y="150" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#0F172A" >After</text><text x="1152" y="150" text-anchor="end" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#22C55E" >26%</text><rect x="732" y="166" width="420" height="54" rx="12" fill="#E2E8F0"/><rect x="735.0" y="171" width="69.6" height="44" rx="9" fill="#64748B"/><rect x="810.6" y="171" width="27.6" height="44" rx="9" fill="#F59E0B"/><text x="48" y="270" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A" >Best time: after you finish a task, before starting the next one.</text><text x="48" y="298" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" >If you wait, Antigravity cleans up on its own at the worst moment and picks what to forget for you.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
